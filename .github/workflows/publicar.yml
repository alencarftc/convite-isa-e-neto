name: Publicar convite

# Publica no GitHub Pages a cada envio para a main (SPEC-10). O gate de publicação roda primeiro: enquanto
# houver texto pendente, arte provisória, arquivo ausente ou data fora do padrão, nada é publicado e a
# versão anterior continua no ar.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verificar e gerar o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # versão vem do campo packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gate de publicação (texto, datas, links, arte, arquivos, serviços externos)
        run: pnpm verificar
      - name: Gates de código e build
        run: pnpm check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
