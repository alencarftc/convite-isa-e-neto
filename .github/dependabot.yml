version: 2

updates:
  - package-ecosystem: npm # cobre pnpm (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
      prefix-development: 'build(deps-dev)'
    groups:
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Os tipos do Node acompanham o Node mínimo do projeto (22): a versão 26 descreve APIs que ele não tem.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # A 17 exige Node >= 22.22.1 e o `engine-strict` impede a instalação no Node 22.12 a 22.22.0 (veja o AGENTS.md).
      - dependency-name: lint-staged
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci(deps)'
