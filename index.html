<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Título, descrição, ícones e og:*: gerados de content.ts e config.ts por scripts/vite/metadados.ts (SPEC-10). -->
    <!--METADADOS-->
    <meta name="theme-color" content="#91A8D0" />
    <!-- Fontes do próprio site, pré-carregadas para os nomes não piscarem (SPEC-02, RF-02.2). -->
    <link
      rel="preload"
      href="/fonts/great-vibes-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body data-fase="carregando">
    <div id="app">
      <!--
        Primeiro quadro (SPEC-02, RF-02.1): fundo marfim, névoa em CSS e os nomes, sem depender de
        JavaScript. O texto aqui só vale até o script rodar; depois os rótulos vêm de content.entrada.
      -->
      <section class="entrada" aria-labelledby="entrada-nomes">
        <div class="nevoa" aria-hidden="true"><span></span><span></span></div>
        <h1 id="entrada-nomes" class="entrada__nomes">Isabella &amp; David</h1>
        <button class="entrada__tocar" type="button" hidden>
          <span class="entrada__chamada">Toque para entrar</span>
          <span class="entrada__volume">Para uma experiência completa, aumente o volume.</span>
        </button>
        <button class="entrada__pular" type="button" hidden>Pular para o convite</button>
        <p class="entrada__aguarde" role="status" hidden>Preparando o bosque…</p>
      </section>
    </div>
    <!-- Gerado a partir de content.ts por scripts/vite/noscript.ts (SPEC-09, RF-09.9). -->
    <!--NOSCRIPT-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
